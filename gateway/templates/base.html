<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Traffic Management System{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    body { background: #f4f6f9; }
    .topbar { background: #1a2b45; }
    .topbar .navbar-brand,
    .topbar .nav-link,
    .topbar .navbar-text { color: #fff; }
    .topbar .nav-link { opacity: .85; }
    .topbar .nav-link:hover,
    .topbar .nav-link.active { opacity: 1; text-decoration: underline; }
    .main { padding: 2rem 0; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-radius: .75rem; }
    .stat-card .display-5 { font-weight: 700; }
    .badge-LOW      { background-color: #198754; }
    .badge-MODERATE { background-color: #fd7e14; }
    .badge-HIGH     { background-color: #dc3545; }
    .badge-SEVERE   { background-color: #6f42c1; }
    .badge-PENDING  { background-color: #0dcaf0; color:#000; }
    .badge-PAID     { background-color: #198754; }
    .badge-CANCELLED{ background-color: #6c757d; }
    .badge-OVERDUE  { background-color: #dc3545; }
    table th { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg topbar">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'home' %}">
      <i class="bi bi-traffic-cone me-2"></i>Traffic Management Gateway
    </a>
    <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav me-auto">
        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
        <a class="nav-link {% if 'vehicle' in request.resolver_match.url_name|default:'' %}active{% endif %}" href="{% url 'vehicle_list' %}">Vehicles</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'violations' %}active{% endif %}" href="{% url 'violations' %}">Violations</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'congestion' %}active{% endif %}" href="{% url 'congestion' %}">Traffic</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'emergency_control' %}active{% endif %}" href="{% url 'emergency_control' %}">Emergency</a>
      </div>
      <span class="navbar-text small">API-first coursework gateway</span>
    </div>
  </div>
</nav>
<div class="container main">
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
